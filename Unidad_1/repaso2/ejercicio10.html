<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 10 USO DE APPENDCHILD</title>
</head>
<body>
    <div id="contenedor"> Contenedor Inicial</div>
    <button id="boton">Agregar Elemento</button>

    <script>
        const nuevo_elemento=document.createElement('div') //PARA CREAR ELEMENTOS HTML
        nuevo_elemento.textContent='Elemento creado con DOM';
        const contenedor= document.getElementById('contenedor')
        contenedor.appendChild(nuevo_elemento);//agregar el hijo al contenedor
        console.log(contenedor)
    </script>
</body>
</html>
