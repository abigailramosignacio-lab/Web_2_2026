<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cine | Editar boleto</title>
  <link rel="stylesheet" href="../assets/css/base/base.css" />
  <link rel="stylesheet" href="../assets/css/componentes/header.css" />
  <link rel="stylesheet" href="../assets/css/componentes/card.css" />
  <link rel="stylesheet" href="../assets/css/componentes/inputs.css" />
  <link rel="stylesheet" href="../assets/css/componentes/button.css" />
</head>
<body>
  <header class="header container">
    <span class="header__logo">Cine</span>
    <nav>
      <ul class="header__list-nav">
        <li class="header__link"><a href="listar_clientes.html">Clientes</a></li>
        <li class="header__link"><a href="listar_peliculas.html">Películas</a></li>
        <li class="header__link"><a href="listar_salas.html">Salas</a></li>
        <li class="header__link"><a href="listar_horarios.html">Horarios</a></li>
        <li class="header__link"><a href="listar_boletos.html">Boletos</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <section class="card">
      <h1 class="card__title">Editar boleto</h1>
      <form data-form>
        <input type="hidden" id="boleto-id" />
        <div class="input-container">
          <select id="clienteId" class="input" required></select>
          <label class="input-label" for="clienteId">Cliente</label>
        </div>
        <div class="input-container">
          <select id="horarioId" class="input" required></select>
          <label class="input-label" for="horarioId">Horario</label>
        </div>
        <div class="input-container">
          <input class="input" id="asiento" name="asiento" placeholder="Asiento" required />
          <label class="input-label" for="asiento">Asiento</label>
        </div>
        <div class="input-container">
          <input class="input" id="precio" name="precio" type="number" min="0" step="0.01" required />
          <label class="input-label" for="precio">Precio</label>
        </div>
        <div class="input-container">
          <input class="input" id="fechaCompra" name="fechaCompra" type="date" required />
          <label class="input-label" for="fechaCompra">Fecha compra</label>
        </div>
        <button class="button">Guardar cambios</button>
      </form>
    </section>
  </main>
  <script type="module" src="../controllers/editar_boleto_controller.js"></script>
</body>
</html>
