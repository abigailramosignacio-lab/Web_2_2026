<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 11 REMUVECHILD</title>
</head>
<body>
    <div id="contenedor">
        <div id="eliminado">Eliminar</div>
    </div>
    <script>
        const elementoEliminar=document.getElementById('eliminado');
        const elementoPadre=elementoEliminar.parentElement;//solo se puede eliminar atravez del padre
        elementoPadre.removeChild(elementoEliminar);
    </script>
</body>
</html>
