<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Local Server</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Dosis&family=Open+Sans&family=Parisienne&display=swap" rel="stylesheet"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
    <div class="container">
        <header>
            <h1>CRUD Local Server</h1>
        </header>

        <div class="controls">
            <button class="btn btn-get" onclick="getData()">Obtener Posts (GET)</button>
            <button class="btn btn-post" onclick="postData()">Crear Post (POST)</button>
            <button class="btn btn-put" onclick="putData()">Actualizar Post 1 (PUT)</button>
            <button class="btn btn-delete" onclick="deleteData()">Eliminar Post 1 (DELETE)</button>
        </div>
        
        <div class="forms-container">
            <!-- Formulario POST -->
            <div class="form-card">
                <h3>
                    <i class="fas fa-plus-circle"></i>
                    Crear Nuevo Post
                </h3>
                <form id="createPostForm">
                    <div class="form-group">
                        <label for="postTitulo">Título:</label>
                        <input type="text" id="postTitulo" name="titulo" required placeholder="Ingrese el título">
                    </div>
                    <div class="form-group">
                        <label for="postDescripcion">Descripción:</label>
                        <textarea id="postDescripcion" name="descripcion" rows="3" required placeholder="Ingrese la descripción"></textarea>
                    </div>
                    <button type="submit" class="btn btn-post-form">
                        <i class="fas fa-save"></i> Crear Post
                    </button>
                </form>
            </div>

            <!-- Formulario para PUT-->
            <div class="form-card">
                <h3>
                    <i class="fas fa-edit"></i>
                    Actualizar Post
                </h3>
                <form id="updatePostForm">
                    <div class="form-group">
                        <label for="updateId">ID del Post a actualizar:</label>
                        <input type="text" id="updateId" name="id" required placeholder="Ej: 2, B0-wLeB7GLY">
                        <small class="help-text">Primero haz clic en "Obtener Posts" para ver los IDs disponibles</small>
                    </div>
                    <div class="form-group">
                        <label for="updateTitulo">Nuevo Título:</label>
                        <input type="text" id="updateTitulo" name="titulo" required placeholder="Nuevo título">
                    </div>
                    <div class="form-group">
                        <label for="updateDescripcion">Nueva Descripción:</label>
                        <textarea id="updateDescripcion" name="descripcion" rows="3" required placeholder="Nueva descripción"></textarea>
                    </div>
                    <button type="submit" class="btn btn-put-form">
                        <i class="fas fa-sync-alt"></i> Actualizar Post
                    </button>
                </form>
            </div>
        </div>

        <div class="results">
            <h3>Resultados:</h3>
            <div id="status"></div>
            <pre id="result">RESULTADO..</pre>
        </div>
    </div>

    <script src="js/get.js"></script>
    <script src="js/post.js"></script>
    <script src="js/put.js"></script>
    <script src="js/delete.js"></script>
    <script src="js/forms.js"></script> 
    
    <script>
        function showResult(data, isError = false) {
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');
            
            if (isError) {
                statusEl.innerHTML = '<div class="status status-error">Error en la operación</div>';
                resultEl.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            } else {
                statusEl.innerHTML = '<div class="status status-success">Operación exitosa</div>';
                resultEl.textContent = JSON.stringify(data, null, 2);
            }
        }
    </script>
    </main>
</body>
</html>
