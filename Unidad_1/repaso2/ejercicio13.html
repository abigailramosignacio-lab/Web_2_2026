<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 13 PREVETDEFAULT</title>
</head>
<body>
    <div id="enlace" href="https//www.google.com">Enlace</div>

    <script>
        const enlace = document.getElementsById('enlace')
        enlace.addEventListener('click', (evento) =>{
            event.preventDefault()
            alert('Enlace bloqueado')
        });
    </script>
</body>
</html>
