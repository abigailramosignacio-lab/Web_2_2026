<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas (API)</title>

  <link href="https://fonts.googleapis.com/css2?family=Dosis&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<main>

  <!-- FORMULARIO -->
  <div class="formContainer">
    <h2>Agregar Tarea</h2>

    <form data-form>

      <input type="text" placeholder="Nombre de la tarea" data-input-task required>
      <input type="text" placeholder="Descripción" data-input-descripcion required>
      <input type="date" data-input-fecha required>
      <input type="text" placeholder="Prioridad" data-input-prioridad required>
      <input type="text" placeholder="Materia" data-input-materia required>
      <input type="text" placeholder="Docente" data-input-docente required>
      <input type="date" data-input-fechalimite required>

      <button type="submit" class="btnCreate">Agregar</button>

    </form>
  </div>

  <div class="contentContainer">

    <div class="tableContainer">
      <h2>Lista de Tareas</h2>

      <table id="taskTable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Fecha</th>
            <th>Prioridad</th>
            <th>Materia</th>
            <th>Docente</th>
            <th>Fecha Límite</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          <!-- Se llena con JS -->
        </tbody>
      </table>
    </div>

    <div class="cardsContainer">
      <h2>Tareas Registradas</h2>
      <div id="taskCards"></div>
    </div>

  </div>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
