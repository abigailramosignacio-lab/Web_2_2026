<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 14 STOPPROPAGATION</title>
</head>
<body>
    <div id="padre">Elemento padre
        <div id="hijo">Elemento hijo</div>
    </div>
    <script>
        const elemntoHijo=document.getElementById('hijo');
        elemntoHijo.addEventListener('click',(event) =>{
            event.stopPropagation(); //hace que no se vaya a propagar
            alert('evento hijo')
        });
        const elementoPadre = document.getElementById('padre');
        elementoPadre.addEventListener('click',(event)=>{
            event.stopEventPropagation();
            alert('evento padre');
        });
    </script>
</body>
</html>
